[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-osint-enricher"
version = "0.1.0"
description = "Local OSINT email enrichment tool using GHunt and Holehe"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "openpyxl>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer[all]>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "dnspython>=2.4",
]

[project.optional-dependencies]
ghunt = ["ghunt>=2.0"]
holehe = ["holehe>=1.61"]
all = ["ghunt>=2.0", "holehe>=1.61"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.scripts]
email-osint-enricher = "email_osint_enricher.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/email_osint_enricher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
